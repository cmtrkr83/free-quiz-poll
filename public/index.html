    <title>Canlı Oturum — Katıl</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/join.js?v=__ASSET_VERSION__"></script>
