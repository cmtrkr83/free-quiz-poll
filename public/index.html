<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070a14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Canlı anket, quiz ve kelime bulutu. Telefonunuzla katılın, sonuçları anında görün." />
    <title>Canlı Oturum — Katıl</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="/js/theme.js?v=__ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/css/style.css?v=__ASSET_VERSION__" />
  </head>
  <body class="player-body">
    <div class="player">
      <header class="p-top">
        <a class="brand" href="/">
          <span class="brand-mark">⚡</span>
          <span>Canlı Oturum</span>
        </a>
        <span class="net" id="net" hidden><span class="dot off"></span> Bağlantı yok — yeniden deneniyor</span>
      </header>

      <main class="p-main" id="screen" aria-live="polite"></main>

      <footer class="p-foot">
        <span id="foot">Telefonunuzdan katılın · Sonuçlar anında</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/join.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
